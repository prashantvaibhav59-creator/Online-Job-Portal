
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Online Job Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
        }

        .signup-card {
            width: 100%;
            max-width: 440px;
            padding: 35px 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(30, 64, 120, 0.12);
            animation: appear 0.6s ease;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #172554;
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 13px;
            margin-bottom: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.25s, transform 0.25s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 28px 21px;
            }

            h1 {
                font-size: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="signup-card">
        <div class="logo">J</div>

        <h1>Create Your Account</h1>
        <p class="subtitle">Join our Online Job Portal</p>

        <form id="signup-form">
            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="role">Account Type</label>
            <select id="role" name="role" required>
                <option value="">Select account type</option>
                <option value="jobseeker">Job Seeker</option>
                <option value="employer">Employer</option>
            </select>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>
    </main>

    <script>
        document.getElementById("signup-form").addEventListener("submit", function (event) {
            event.preventDefault();
            alert("The signup form design is ready, but account creation is not connected yet.");
        });
    </script>
</body>
</html>
